appId: com.a1ether.chief
productName: Chief
copyright: Copyright © 2026 A1ether

directories:
  output: release
  buildResources: build

afterPack: ./scripts/afterPack.cjs

files:
  - out/**/*
  - package.json

npmRebuild: false

mac:
  # 无开发者证书：electron-builder 跳过签名，由 afterPack 补 ad-hoc 签名
  identity: null
  icon: build/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    LSMinimumSystemVersion: '12.0'
    NSHumanReadableCopyright: Copyright © 2026 A1ether

dmg:
  title: Chief ${version}

artifactName: ${productName}-${version}-${arch}.${ext}
